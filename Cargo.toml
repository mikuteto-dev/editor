[package]
name = "editor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
tree-sitter-vue-next = "0.1"
unicode-width = "0.2"
svgtypes = "0.16"
# Already used by GPUI; PDF previews use native CoreGraphics and existing image buffers.
image = { version = "0.25", default-features = false }
libc = "0.2"
tempfile = "3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
gpui-kit = { version = "=0.8.1", features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-diff",
    "tree-sitter-make",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-markdown-inline",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = "8"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
# Already in the tree through gpui; carries Finder "open file" events into the app.
smol = "2"
# Already in the tree through gpui-component: reading package metadata, and the hover API's types.
anyhow = "1"
lsp-types = "0.97"
serde_json = "1"
# Deno names its cache files by SHA-256; already in the tree.
sha2 = "0.10"

[dev-dependencies]
resvg = "0.46"
# Headless windows for UI tests: render, click and type without showing anything. gpui-kit's own
# test-support would drag its unused gpui-fast backend into resolution and clash over taffy.
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

# gpui-component's own dev settings: the debug app is unusably slow without these.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Patched copies, changes marked "editor patch:". gpui-component skips the font probe on macOS
# (~80 ms of startup) and caches highlight queries; gpui-base draws gutter bars and line-end labels.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }
